# Alembic configuration (task 1.2).
#
# Two things are deliberately absent:
#
# * `sqlalchemy.url`. The database file is decided by `SQLITE_DB_PATH` (design §18) and resolved
#   through `Settings`, so duplicating it here would create a second source of truth that silently
#   wins for CLI invocations. `migrations/env.py` builds the engine through
#   `c360.data.engine.create_sqlite_engine` instead, which also means migrations run under exactly
#   the pragmas the application uses — including `foreign_keys = ON`, so a migration cannot leave
#   behind rows that violate a constraint it just declared.
# * autogenerate settings. Migrations are hand-written DDL taken verbatim from design §4.3.
#   Autogenerate round-trips SQLite CHECK constraints poorly, and the CHECK constraints *are* the
#   requirement here (14.5), not incidental decoration.
#
# Override the target database ad hoc with either form:
#   alembic -x db_path=/tmp/scratch.db upgrade head
#   C360_DB_PATH=/tmp/scratch.db alembic upgrade head

[alembic]
script_location = migrations

# `src` puts the `c360` package on the path without requiring an editable install; `.` is not
# needed because migrations import shared helpers from `c360.data.ddl`.
prepend_sys_path = src

# Governs how `prepend_sys_path` and `version_locations` are split. `os` uses the platform path
# separator instead of the legacy behaviour of splitting on spaces, commas *and* colons — which on
# Windows would split a path at its drive letter. Alembic 1.20 renamed this from
# `version_path_separator`; the old name still works but warns, and warnings are errors here.
path_separator = os

# File name pattern: a zero-padded ordinal reads in dependency order in a directory listing, which
# a random hex slug does not.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are informational only; UTC so they are comparable across machines.
timezone = UTC

# ---------------------------------------------------------------- logging
# Alembic's own logging only; the application's JSON logging is configured in c360.core.logging and
# is not active for CLI migration runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
