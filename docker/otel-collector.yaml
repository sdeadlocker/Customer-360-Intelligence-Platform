# Collector configuration for local development.
#
# The span attribute allowlist is enforced in the application (design §13.4, requirement 18.8), not
# here. A collector-side filter would still let PII leave the process, and a second deployment of
# the collector without this config would silently lose the protection. The redaction below is a
# defence in depth only.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

  # Belt and braces: drop attribute keys that must never appear, in case an unreviewed
  # instrumentation change bypasses the in-process allowlist.
  attributes/scrub:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: db.statement.parameters
        action: delete
      - key: http.request.header.authorization
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
