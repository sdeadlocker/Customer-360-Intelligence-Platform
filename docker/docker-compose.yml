# Local observability stack for the Phase 0 gate.
#
# The app is deliberately not containerised here. Phase 0 needs a collector and a trace UI to
# verify that a request produces a trace carrying a correlation ID and no disallowed attributes;
# running the API on the host keeps the edit-reload loop fast.
#
#   docker compose -f docker/docker-compose.yml up -d
#   # then, from backend/, with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#   uvicorn c360.main:create_app --factory --reload
#
# Jaeger UI: http://localhost:16686

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: c360-jaeger
    ports:
      - '16686:16686' # UI
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: c360-otel-collector
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC — what the API exports to
      - '4318:4318' # OTLP HTTP
    depends_on:
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: c360-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector
    restart: unless-stopped

  # Grafana with the four dashboards (task 10.7, design §13.6) and its datasources provisioned as
  # code, so a fresh `docker compose up` brings the dashboards up already wired to Prometheus and
  # Jaeger — no click-ops, no manual import. Anonymous viewer access is enabled for local use only.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: c360-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: 'light'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
